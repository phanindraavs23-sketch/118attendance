<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>118 Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#17202a}
.card{max-width:520px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 18px #0001}
h1{text-align:center;margin-top:0}.qr{display:flex;justify-content:center;margin:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}
.buttons{display:flex;gap:12px;margin-top:18px}.buttons button{flex:1}
button{padding:13px;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
.login{background:#198754;color:white}.logout{background:#dc3545;color:white}
#msg{margin-top:18px;padding:12px;border-radius:8px;display:none}
.hint{text-align:center;color:#666;font-size:13px}
.url{font-size:12px;word-break:break-all;text-align:center;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>118 Attendance</h1>
<p class="hint">Enter or edit your Name, Employee ID and Location, then select Login or Logout.</p>
<div class="qr" id="qrcode"></div>
<div class="url" id="pageUrl"></div>

<label for="name">Employee Name</label>
<input id="name" type="text" placeholder="Enter employee name" autocomplete="name">

<label for="employeeId">Employee ID</label>
<input id="employeeId" type="text" placeholder="Enter employee ID">

<label for="location">Location</label>
<input id="location" type="text" placeholder="Enter location, e.g. Office / Home">

<div class="buttons">
<button class="login" onclick="markAttendance('LOGIN')">Login</button>
<button class="logout" onclick="markAttendance('LOGOUT')">Logout</button>
</div>
<div id="msg"></div>
</div>

<script src="config.js"></script>
<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const pageUrl = new URL('./', location.href).href;
document.getElementById('pageUrl').textContent = pageUrl;
new QRCode(document.getElementById('qrcode'), {
  text: pageUrl, width: 220, height: 220,
  correctLevel: QRCode.CorrectLevel.M
});

function showMsg(text, ok=false){
  const el=document.getElementById('msg');
  el.style.display='block';
  el.style.background=ok ? '#d1e7dd' : '#f8d7da';
  el.style.color=ok ? '#0f5132' : '#842029';
  el.textContent=text;
}

async function markAttendance(action){
  const name=document.getElementById('name').value.trim();
  const employeeId=document.getElementById('employeeId').value.trim();
  const locationValue=document.getElementById('location').value.trim();

  if(!name || !employeeId || !locationValue){
    showMsg('Please enter Employee Name, Employee ID and Location.');
    return;
  }

  const {error}=await client.from('qr_attendance').insert({
    employee_name:name,
    employee_id:employeeId,
    location:locationValue,
    action:action
  });

  if(error){
    showMsg('Unable to save attendance: '+error.message);
    return;
  }

  showMsg(`${action === 'LOGIN' ? 'Login' : 'Logout'} recorded for ${name} (${employeeId}) at ${locationValue}.`, true);
}
</script>
</body>
</html>
